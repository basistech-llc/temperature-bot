<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Floor Plan</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 100%; /* Ensures it scales on smaller screens */
            cursor: pointer;
        }
        #room-tooltip {
            position: fixed;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 14px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1000;
            visibility: hidden;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #room-tooltip.visible {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h2>Interactive Office Floor Plan</h2>
    <canvas id="floorplanCanvas"></canvas>
    <div id="room-tooltip"></div>

<script>
    // 1. The Bounding Box Data (Normalized Coordinates: 0.0 to 1.0)
    // x, y = top left corner. w, h = width and height.
    const regions = [
      { id: 'garage', label: 'GARAGE', x: 0.205, y: 0.290, w: 0.540, h: 0.400 },
      { id: 'broadway', label: 'Broadway', x: 0.845, y: 0.263, w: 0.120, h: 0.388 },
      { id: 'sunken_garden', label: 'Sunken Garden', x: 0.534, y: 0.169, w: 0.181, h: 0.122 },
      { id: 'media_room', label: 'Hickory', x: 0.174, y: 0.059, w: 0.069, h: 0.203 },
      { id: 'area_51', label: 'Area 51',  x: 0.249, y: 0.058, w: 0.289, h: 0.208 },
      { id: 'dungeon', label: 'Dungeon', x: 0.149, y: 0.272, w: 0.058, h: 0.213 },
      { id: 'bamboo', label: 'Bamboo', x: 0.733, y: 0.037, w: 0.092, h: 0.137 },
      { id: 'greenhouse', label: 'Greenhouse', x: 0.532, y: 0.038, w: 0.206, h: 0.138 }
    ];

    const canvas = document.getElementById('floorplanCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('room-tooltip');
    const TOOLTIP_OFFSET = 14;

    // 2. Load the Image
    const img = new Image();
    img.src = 'basistech_floorplan.png';

    img.onload = () => {
        // Set canvas to match the image's exact intrinsic dimensions
        canvas.width = img.width;
        canvas.height = img.height;
        draw(); // Initial draw
    };

    // 3. Drawing Logic
    function draw(hoveredId = null) {
        // Clear and draw background image
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        regions.forEach(r => {
            // Convert normalized decimals to actual pixels
            let px = r.x * canvas.width;
            let py = r.y * canvas.height;
            let pw = r.w * canvas.width;
            let ph = r.h * canvas.height;

            ctx.beginPath();
            ctx.rect(px, py, pw, ph);

            // Styling: Highlight blue if hovered, otherwise transparent red
            if (r.id === hoveredId) {
                ctx.fillStyle = 'rgba(0, 123, 255, 0.4)'; // Hover state
                ctx.strokeStyle = '#0056b3';
            } else {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; // Default state
                ctx.strokeStyle = 'red';
            }

            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            // Optional: Draw text labels directly on the canvas
            ctx.fillStyle = 'black';
            ctx.font = 'bold 14px Arial';
            // ctx.fillText(r.label, px + 10, py + 20); // Uncomment to draw names in the boxes
        });
    }

    // 4. Interactivity (Hover Detection)
    canvas.addEventListener('mousemove', (e) => {
        // Get mouse coordinates relative to the canvas
        const rect = canvas.getBoundingClientRect();

        // Scale mouse coordinates to account for CSS resizing
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        let foundHover = null;

        // Check if mouse is inside any region
        for (let r of regions) {
            let px = r.x * canvas.width;
            let py = r.y * canvas.height;
            let pw = r.w * canvas.width;
            let ph = r.h * canvas.height;

            if (mouseX >= px && mouseX <= px + pw &&
                mouseY >= py && mouseY <= py + ph) {
                foundHover = r;
                break;
            }
        }

        // Update canvas and tooltip
        if (foundHover) {
            draw(foundHover.id);
            tooltip.textContent = foundHover.label;
            tooltip.classList.add('visible');
            tooltip.style.left = (e.clientX + TOOLTIP_OFFSET) + 'px';
            tooltip.style.top = (e.clientY + TOOLTIP_OFFSET) + 'px';
            canvas.style.cursor = 'pointer';
        } else {
            draw();
            tooltip.classList.remove('visible');
            canvas.style.cursor = 'default';
        }
    });
    canvas.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
        draw();
        canvas.style.cursor = 'default';
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Floor Plan</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 100%; /* Ensures it scales on smaller screens */
            cursor: pointer;
        }
        #info-box {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-left: 5px solid #007bff;
            font-size: 1.2em;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>Interactive Office Floor Plan</h2>
    <canvas id="floorplanCanvas"></canvas>
    <br>
    <div id="info-box">Hover over a room...</div>

<script>
    // 1. The Bounding Box Data (Normalized Coordinates: 0.0 to 1.0)
    // x, y = top left corner. w, h = width and height.
    const regions = [
        { id: 'garage', label: 'GARAGE', x: 0.205, y: 0.290, w: 0.540, h: 0.400 },
        { id: 'c004_top', label: 'C004 (Top Left)', x: 0.170, y: 0.040, w: 0.360, h: 0.220 },
        { id: 'c003', label: 'C003 (Top Right)', x: 0.535, y: 0.035, w: 0.285, h: 0.250 },
        { id: 'c002', label: 'C002 (Right Side)', x: 0.840, y: 0.320, w: 0.125, h: 0.320 },
        { id: 'c001', label: 'C001 (Bottom Right)', x: 0.815, y: 0.785, w: 0.170, h: 0.180 },
        { id: 'd06', label: 'Room D06', x: 0.188, y: 0.810, w: 0.080, h: 0.115 },
        { id: 'd05', label: 'Room D05', x: 0.270, y: 0.825, w: 0.045, h: 0.100 },
        { id: 'd04', label: 'Room D04', x: 0.388, y: 0.805, w: 0.055, h: 0.120 }
    ];

    const canvas = document.getElementById('floorplanCanvas');
    const ctx = canvas.getContext('2d');
    const infoBox = document.getElementById('info-box');

    // 2. Load the Image
    const img = new Image();
    img.src = 'basistech_floorplan.png';

    img.onload = () => {
        // Set canvas to match the image's exact intrinsic dimensions
        canvas.width = img.width;
        canvas.height = img.height;
        draw(); // Initial draw
    };

    // 3. Drawing Logic
    function draw(hoveredId = null) {
        // Clear and draw background image
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        regions.forEach(r => {
            // Convert normalized decimals to actual pixels
            let px = r.x * canvas.width;
            let py = r.y * canvas.height;
            let pw = r.w * canvas.width;
            let ph = r.h * canvas.height;

            ctx.beginPath();
            ctx.rect(px, py, pw, ph);

            // Styling: Highlight blue if hovered, otherwise transparent red
            if (r.id === hoveredId) {
                ctx.fillStyle = 'rgba(0, 123, 255, 0.4)'; // Hover state
                ctx.strokeStyle = '#0056b3';
            } else {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; // Default state
                ctx.strokeStyle = 'red';
            }

            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            // Optional: Draw text labels directly on the canvas
            ctx.fillStyle = 'black';
            ctx.font = 'bold 14px Arial';
            // ctx.fillText(r.label, px + 10, py + 20); // Uncomment to draw names in the boxes
        });
    }

    // 4. Interactivity (Hover Detection)
    canvas.addEventListener('mousemove', (e) => {
        // Get mouse coordinates relative to the canvas
        const rect = canvas.getBoundingClientRect();

        // Scale mouse coordinates to account for CSS resizing
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        let foundHover = null;

        // Check if mouse is inside any region
        for (let r of regions) {
            let px = r.x * canvas.width;
            let py = r.y * canvas.height;
            let pw = r.w * canvas.width;
            let ph = r.h * canvas.height;

            if (mouseX >= px && mouseX <= px + pw &&
                mouseY >= py && mouseY <= py + ph) {
                foundHover = r;
                break;
            }
        }

        // Update UI if hover state changes
        if (foundHover) {
            draw(foundHover.id);
            infoBox.innerText = `Currently viewing: ${foundHover.label}`;
            canvas.style.cursor = 'pointer';
        } else {
            draw(); // Redraw with no hover
            infoBox.innerText = 'Hover over a room...';
            canvas.style.cursor = 'default';
        }
    });
</script>

</body>
</html>

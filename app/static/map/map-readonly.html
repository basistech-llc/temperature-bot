<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Floor Plan</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 100%; /* Ensures it scales on smaller screens */
            cursor: pointer;
        }
        #room-tooltip {
            position: fixed;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 14px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1000;
            visibility: hidden;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #room-tooltip.visible {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h2>Interactive Office Floor Plan</h2>
    <canvas id="floorplanCanvas"></canvas>
    <div id="room-tooltip"></div>

<script src="floorplan_common.js"></script>
<script>
    const canvas = document.getElementById('floorplanCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('room-tooltip');
    const TOOLTIP_OFFSET = 14;

    const img = new Image();
    img.src = FLOORPLAN_IMAGE;

    img.onload = function () {
        canvas.width = img.width;
        canvas.height = img.height;
        drawRegions(ctx, img, regions, null);
    };

    function draw(hoveredId) {
        drawRegions(ctx, img, regions, hoveredId || null);
    }

    canvas.addEventListener('mousemove', function (e) {
        const result = getRegionAt(canvas, regions, e.clientX, e.clientY);
        if (result.region) {
            draw(result.region.id);
            tooltip.textContent = result.region.label;
            tooltip.classList.add('visible');
            tooltip.style.left = (e.clientX + TOOLTIP_OFFSET) + 'px';
            tooltip.style.top = (e.clientY + TOOLTIP_OFFSET) + 'px';
            canvas.style.cursor = 'pointer';
        } else {
            draw(null);
            tooltip.classList.remove('visible');
            canvas.style.cursor = 'default';
        }
    });
    canvas.addEventListener('mouseleave', function () {
        tooltip.classList.remove('visible');
        draw(null);
        canvas.style.cursor = 'default';
    });
</script>

</body>
</html>

{% extends 'base.html' %}
{% block title %} AE200 Alerts {% endblock %}
{% block head %}
<link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
<script src="{{ url_for('static', filename='time_utils.js') }}"></script>
{% endblock %}

{% block body %}
<div class="pure-g"><!-- the start of the pure row -->
  <div class="pure-u-1"><!-- across the entire row -->
  <h1>AE200 Alerts</h1>
  </div>
</div>

<div class="pure-g">
  <div class="pure-u-1">
    <div class="pure-menu pure-menu-horizontal">
      <ul class="pure-menu-list">
        <li class="pure-menu-item">
          <a href="#" id="active-tab" class="pure-menu-link tab-link active">Active Alerts</a>
        </li>
        <li class="pure-menu-item">
          <a href="#" id="history-tab" class="pure-menu-link tab-link">Alert History</a>
        </li>
      </ul>
    </div>

    <div class="pure-form">
      <label for="device-filter">Filter by device:</label>
      <select id="device-filter" class="pure-input-1-4">
        <option value="">All devices</option>
        {% for device_id, device_name in devices.items() %}
        <option value="{{ device_id }}">{{ device_name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>

<div class="pure-g">
  <div class="pure-u-1">
    <div id="active-alerts-table"></div>
    <div id="history-alerts-table" class="tab-hidden"></div>
  </div>
</div>

<script>
// Tab switching
document.getElementById('active-tab').addEventListener('click', function(e) {
  e.preventDefault();
  showTab('active');
});

document.getElementById('history-tab').addEventListener('click', function(e) {
  e.preventDefault();
  showTab('history');
});

function showTab(tabName) {
  // Update tab styling
  document.querySelectorAll('.tab-link').forEach(link => {
    link.classList.remove('active');
  });
  document.getElementById(tabName + '-tab').classList.add('active');

  const activeDiv = document.getElementById('active-alerts-table');
  const historyDiv = document.getElementById('history-alerts-table');

  if (tabName === 'active') {
    activeDiv.classList.remove('tab-hidden');
    historyDiv.classList.add('tab-hidden');
  } else {
    activeDiv.classList.add('tab-hidden');
    historyDiv.classList.remove('tab-hidden');
  }

  // Refresh data
  if (tabName === 'active') {
    activeTable.setData();
  } else {
    historyTable.setData();
  }
}

// Device filter
document.getElementById('device-filter').addEventListener('change', function() {
  const deviceId = this.value;
  activeTable.setData('/api/v1/alerts/active' + (deviceId ? '?device_id=' + deviceId : ''));
  historyTable.setData('/api/v1/alerts/history' + (deviceId ? '?device_id=' + deviceId : ''));
});

// formatDuration is now loaded from time_utils.js (start of trying non-playwright testing)

// Format timestamp
function formatTimestamp(timestamp) {
  return new Intl.DateTimeFormat(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
    timeZoneName: "short",
  }).format(new Date(timestamp * 1000));
}

// Shared formatters
function rowFormatterFunction(row) {
  const data = row.getData();
  // Active alerts have no end_time field, or end_time is null
  const isResolved = data.end_time != null;

  if (!isResolved) {
    if (data.alert_type === 'Filter warning') {
      row.getElement().classList.add('alert-row-filter-warning');
    } else if (data.alert_type === 'Error') {
      row.getElement().classList.add('alert-row-error');
    } else if (data.alert_type === 'Water issue') {
      row.getElement().classList.add('alert-row-water-issue');
    }
  }
}

function alertTypeFormatter(cell) {
  const value = cell.getValue();
  if (value === 'Filter warning') {
    return value;
  } else if (value === 'Error') {
    return '<span class="alert-type-error">' + value + '</span>';
  } else if (value === 'Water issue') {
    return '<span class="alert-type-water-issue">' + value + '</span>';
  }
  return value;
}

// Active alerts table
const activeTable = new Tabulator("#active-alerts-table", {
  ajaxURL: "/api/v1/alerts/active?include_details=true",
  ajaxResponse: function(url, params, response) {
    return response;
  },
  layout: "fitColumns",
  pagination: "local",
  paginationSize: 50,
  rowFormatter: rowFormatterFunction,
  columns: [
    {title: "Device", field: "device_name", width: 120},
    {title: "Alert Type", field: "alert_type", width: 120,
     formatter: alertTypeFormatter
    },
    {title: "Started", field: "start_time", width: 200,
     formatter: function(cell) {
       return formatTimestamp(cell.getValue());
     }
    },
    {title: "Age", field: "age", width: 100,
     formatter: function(cell) {
       return formatDuration(cell.getValue());
     }
    },
    {title: "Device Status During Alert", field: "details", width: 420,
     formatter: function(cell) {
       const details = cell.getValue();
       if (!details) return '';
       return details.mode + ' | Drive: ' + details.drive + ' | Temp: ' + details.inlet_temp + '°C / ' + details.set_temp + '°C | Fan: ' + details.fan_speed;
     }
    },
    {title: "Status Measured At", field: "details", width: 200,
     formatter: function(cell) {
       const details = cell.getValue();
       if (!details || !details.status_timestamp) return '';
       return formatTimestamp(details.status_timestamp);
     }
    }
  ]
});

// History alerts table
const historyTable = new Tabulator("#history-alerts-table", {
  ajaxURL: "/api/v1/alerts/history?include_details=true",
  ajaxResponse: function(url, params, response) {
    return response;
  },
  layout: "fitColumns",
  pagination: "local",
  paginationSize: 50,
  rowFormatter: rowFormatterFunction,
  columns: [
    {title: "Device", field: "device_name", width: 130},
    {title: "Alert Type", field: "alert_type", width: 120,
     formatter: alertTypeFormatter
    },
    {title: "Started", field: "start_time", width: 200,
     formatter: function(cell) {
       return formatTimestamp(cell.getValue());
     }
    },
    {title: "Ended", field: "end_time", width: 200,
     formatter: function(cell) {
       const value = cell.getValue();
       return value ? formatTimestamp(value) : 'Active';
     }
    },
    {title: "Duration", field: "duration", width: 100,
     formatter: function(cell) {
       return formatDuration(cell.getValue());
     }
    },
    {title: "Device Status During Alert", field: "details", width: 420,
     formatter: function(cell) {
       const details = cell.getValue();
       if (!details) return '';
       return details.mode + ' | Drive: ' + details.drive + ' | Temp: ' + details.inlet_temp + '°C / ' + details.set_temp + '°C | Fan: ' + details.fan_speed;
     }
    },
    {title: "Status Measured At", field: "details", width: 200,
     formatter: function(cell) {
       const details = cell.getValue();
       if (!details || !details.status_timestamp) return '';
       return formatTimestamp(details.status_timestamp);
     }
    }
  ]
});

// Auto-refresh every 30 seconds
setInterval(function() {
  if (!document.getElementById('active-alerts-table').classList.contains('tab-hidden')) {
    activeTable.setData();
  }
}, 30000);
</script>

{% endblock %}

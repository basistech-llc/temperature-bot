{% extends 'base.html' %}
{% block title %} Unit Speed Control {% endblock %}
{% block head %}
<link href="https://unpkg.com/tabulator-tables@{{ tabulator_version }}/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@{{ tabulator_version }}/dist/js/tabulator.min.js"></script>
{% endblock %}

{% block body %}
<div class="pure-g"><!-- the start of the pure row -->
  <div class="pure-u-1"><!-- across the entire row -->
  <h1>Detailed Logs</h1>
  </div>
</div>

<div class="pure-g">
  <div class="pure-u-1">
    <h2>Today's Log</h2>
    <div id="log-table"></div>
  </div>
</div>

<script src="/static/unit_speed.js"></script>

{% endblock %}

{% extends 'base.html' %}
{% block title %} Temperature Time Series {% endblock %}
{% block head %}
{% if dist %}
   <script src="https://cdn.jsdelivr.net/npm/echarts@{{ echarts_version }}"></script>
{% else %}
   <script src="/static/echarts@5"></script>
{% endif %}
<script src="/static/time_series_chart_core.js"></script>
<script src="/static/temperature_chart_support.js"></script>

{% endblock %}
{% block body %}

<div class="pure-g">
  <div id="controls">
    <div id="temperature-mode-controls" class="temperature-mode-controls" role="group" aria-label="Temperature mode">
      <label><input type="radio" name="temperature-mode" value="raw" checked> raw temps</label>
      <label><input type="radio" name="temperature-mode" value="calculated"> calculated temps</label>
    </div>
    <div id="checkboxes">
      <div id="checkbox-controls">
        <button id="selectAllBtn">Select All</button>
        <button id="clearAllBtn">Clear All</button>
      </div>
    </div>
    <div id="rangeControls" class="temporal-buttons">
      <button id="dayBtn">day</button>
      <button id="weekBtn">week</button>
      <button id="monthBtn">month</button>
      <button id="allBtn">all</button>
      <label>Start <input type="date" id="startDate"></label>
      <label>End <input type="date" id="endDate"></label>
   </div>
  </div>
</div>

<!-- Temperature chart -->
<div class="chart-navigation">
  <button type="button" id="earlierDataBtn" class="chart-navigation-button" aria-label="Show earlier data" title="Show earlier data">◀</button>
  <div id="temp-chart"></div>
  <button type="button" id="laterDataBtn" class="chart-navigation-button" aria-label="Show later data" title="Show later data">▶</button>
</div>
<div class="pure-g"><span id="record-count"></span></div>
<div class="pure-g"><button id="downloadCsv">Download CSV</button></div>

{% endblock %}

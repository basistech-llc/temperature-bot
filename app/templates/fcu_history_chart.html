{% extends 'base.html' %}
{% block title %}FCU and Room History{% endblock %}
{% block head %}
{% if dist %}<script src="https://cdn.jsdelivr.net/npm/echarts@{{ echarts_version }}"></script>{% else %}<script src="/static/echarts@5"></script>{% endif %}
<script src="/static/fcu_history_chart.js"></script>
{% endblock %}
{% block body %}
<main class="maxwidth" data-fcu-device-id="{{ fcu_device_id or '' }}" id="fcu-history-page">
  <h1>FCU and Room History</h1>
  <p id="fcu-history-message" role="status" aria-live="polite"></p>
  <div id="fcu-history-chart" class="fcu-history-chart"></div>
</main>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Map Editor{% endblock %}

{% block body %}
<div class="pure-g">
  <div class="pure-u-1">
    <h2>Map Editor</h2>
    <p>
      Hover over rooms to see their names. Draw bounding boxes to add rooms; JSON
      appears in the sidebar.
    </p>
    <iframe
      src="/static/map/map-editable.html"
      width="100%"
      height="800"
      style="border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.15);"
    ></iframe>
  </div>
</div>
{% endblock %}

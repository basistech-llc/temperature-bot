#
# uv sync
# uv add <module>
# uv add --group dev black
# uv run python script.py
# uv run pytest
# uv lock
# uv tree

[project]
name = "temperature-bot"
version = "0.11.0"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "aiohttp (==3.13.5)",
    "djlint (==1.36.4)",
    "flask (==3.1.3)",
    "flask-pydantic (==0.14.0)",
    "google-api-python-client (==2.197.0)",
    "google-auth (==2.53.0)",
    "google-auth-httplib2 (==0.4.0)",
    "google-auth-oauthlib (==1.4.0)",
    "gunicorn (==25.3.0)",
    "jinja2 (==3.1.6)",
    "pymodbus (==3.13.0)",
    "python-dotenv (==1.2.2)",
    "pyyaml (==6.0.3)",
    "requests (==2.34.2)",
    "tabulate (==0.10.0)",
    "websockets (==16.0)",
]

authors = [
	{name="Simson Garfinkel", email="simsong@basistech.com"}
]

readme = "README.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bin"]

[tool.hatch.build.targets.wheel.force-include]
"etc/schema.sql" = "etc/schema.sql"
"VERSION" = "VERSION"
"wsgi.py" = "wsgi.py"

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "djlint==1.36.4",
    "livereload==2.7.1",
    "mypy==1.20.1",
    "playwright==1.60.0",
    "pylint==4.0.5",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-env==1.6.0",
    "pytest-faulthandler==2.0.1",
    "python-docx==1.2.0",
    "ruff==0.15.15",
    "ruff-lsp==0.0.62",
    "types-pyyaml==6.0.12.20260518",
    "types-requests==2.33.0.20260712",
]

[tool.ruff]
exclude = ["lib/"]

[tool.ruff.lint]
ignore = ["ANN201", "ANN401"]  # Ignore missing return type annotations and Any types

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.util"
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "./"
venv = ".venv"
include = ["."]
exclude = [
  "**/build",
  "**/.aws-sam",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/__pycache__",
  "**/conftest.py"
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"

[[tool.pyright.executionEnvironments]]
root = "."




[tool.pytest.ini_options]
norecursedirs = [".tmp", "lib/ctools"]
env = [
    "PYTEST=1",
    "AE200_SIMULATOR=1",
    "HUBITAT_SIMULATOR=1"
]
minversion = "6.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["."]
# Quieter default: only show logs when they matter (WARNING+). Use -v and --log-cli-level=INFO for debug.
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s %(levelname)s [%(name)s] %(message)s"

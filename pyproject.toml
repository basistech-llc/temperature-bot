#
# poetry config virtualenvs.in-project true --scope=global
# poetry install  (by default, installs all groups)
# poetry add <module>
# poetry add --group dev black
# poetry run python script.py
# poetry run pytest
# poetry lock
# poetry show
# poetry show --tree

[project]
name = "temperature-bot"
version = "0.1.0"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "websockets",
    "requests",
    "jinja2",
    "flask",
    "python-dotenv", # If you're using it for environment variables
    "pyyaml (>=6.0.2,<7.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "flask-pydantic (>=0.13.1,<0.14.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pymodbus (>=3.11.1,<4.0.0)",
    "clickhouse-connect (>=0.8.18,<0.9.0)",
    "djlint (>=1.36.4,<2.0.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
]

authors = [
	{name="Simson Garfinkel", email="simsong@basistech.com"}
]

readme = "README.md"

[build-system]
requires = ["poetry-core>=2.0.0, <3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
coverage = "*"
djlint = "*"
livereload = "*"
mypy = "*"
playwright = "*"
pylint = "*"
pyright = "*"
pytest = "*"
pytest-env = "^1.1.5"
pytest-cov = "*"
pytest-faulthandler = "^2.0.1"
ruff = "*"
ruff-lsp = "*"

[tool.ruff]
exclude = ["lib/"]

[tool.ruff.lint]
ignore = ["ANN201", "ANN401"]  # Ignore missing return type annotations and Any types

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "lib.*",
    "tests.*"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "app.util"
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "./"
venv = ".venv"
include = ["."]
exclude = [
  "**/build",
  "**/.aws-sam",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/__pycache__",
  "**/conftest.py"
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"

[[tool.pyright.executionEnvironments]]
root = "."




[tool.pytest.ini_options]
norecursedirs = ["lib/ctools"]
env = [
    "PYTEST=1",
    "AE200_SIMULATOR=1"
]
minversion = "6.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["."]
# Quieter default: only show logs when they matter (WARNING+). Use -v and --log-cli-level=INFO for debug.
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s %(levelname)s [%(name)s] %(message)s"

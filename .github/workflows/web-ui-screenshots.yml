.github/workflows/web-ui-screenshots.ymlname: Web UI Screenshots

on:
  pull_request:

jobs:
  web-ui-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      TEMPERATURE_BOT_CONFIG: "tests/temperature-bot-config-test.yaml"
      AE200_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_SIMULATOR: 1
      POETRY_VERSION: '2.1.3'
      RUFF_VERSION: '0.15.15'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: screenshots-venv-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            screenshots-venv-${{ runner.os }}-3.12-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Ubuntu
        run: |
          make install-ubuntu

      - name: Render web UI screenshots
        run: |
          make web-screenshots

      - name: Upload web UI screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-screenshots-${{ github.run_id }}
          path: var/web-ui-screenshots
          if-no-files-found: error

      - name: Publish screenshots for PR comment
        id: publish_screenshots
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          publish_branch="web-ui-screenshots-pr-${PR_NUMBER}"
          run_path="runs/${RUN_ID}"
          publish_worktree="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${publish_branch}" >/dev/null 2>&1; then
            git fetch origin "${publish_branch}"
            git worktree add -B "${publish_branch}" "${publish_worktree}" "origin/${publish_branch}"
          else
            git worktree add --detach "${publish_worktree}"
            cd "${publish_worktree}"
            git switch --orphan "${publish_branch}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cd "${publish_worktree}"
          mkdir -p "${run_path}"
          cp -R "${GITHUB_WORKSPACE}/var/web-ui-screenshots/." "${run_path}/"
          git add .
          git commit -m "Update web UI screenshots for PR ${PR_NUMBER} run ${RUN_ID}" || true
          git push origin "HEAD:${publish_branch}"

          echo "branch=${publish_branch}" >> "$GITHUB_OUTPUT"
          echo "run_path=${run_path}" >> "$GITHUB_OUTPUT"

      - name: Comment screenshots on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          PUBLISH_BRANCH: ${{ steps.publish_screenshots.outputs.branch }}
          RUN_PATH: ${{ steps.publish_screenshots.outputs.run_path }}
          ARTIFACT_NAME: web-ui-screenshots-${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(
              fs.readFileSync('var/web-ui-screenshots/manifest.json', 'utf8')
            );
            const marker = '<!-- web-ui-screenshots -->';
            const imageBase = [
              'https://github.com',
              context.repo.owner,
              context.repo.repo,
              'blob',
              process.env.PUBLISH_BRANCH,
              process.env.RUN_PATH,
            ].join('/');
            const lines = [
              marker,
              '## Web UI Screenshots',
              '',
              `Generated ${manifest.pages.length} screenshots for this PR.`,
              '',
            ];

            for (const page of manifest.pages) {
              lines.push(
                `### ${page.title}`,
                '',
                `Route: \`${page.path}\``,
                '',
                `![${page.title}](${imageBase}/${page.filename}?raw=1)`,
                ''
              );
            }

            lines.push(
              `The PNGs are also available in the \`${process.env.ARTIFACT_NAME}\` workflow artifact.`
            );

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

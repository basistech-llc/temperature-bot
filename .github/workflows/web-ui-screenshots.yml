name: Web UI Screenshots

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  web-ui-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TEMPERATURE_BOT_CONFIG: "tests/temperature-bot-config-test.yaml"
      AE200_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_SIMULATOR: 1
      POETRY_VERSION: '2.1.3'
      RUFF_VERSION: '0.15.15'
    steps:
      - name: Resolve pull request
        id: resolve_pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoFullName = `${owner}/${repo}`;
            let pull = context.payload.pull_request;

            if (!pull) {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
                per_page: 1,
              });
              pull = pulls[0];
            }

            core.setOutput('number', pull ? String(pull.number) : '');
            core.setOutput(
              'same_repo',
              pull ? String(pull.head.repo.full_name === repoFullName) : 'false'
            );

      - name: Checkout
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Set up Node.js
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache .venv
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: screenshots-venv-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            screenshots-venv-${{ runner.os }}-3.12-

      - name: Cache Playwright browsers
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/cache@v4
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Ubuntu
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: |
          make install-ubuntu

      - name: Render web UI screenshots
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: |
          make web-screenshots

      - name: Upload screenshots for PR comment
        id: upload_screenshots
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        env:
          IMGUR_CLIENT_ID: ${{ vars.IMGUR_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${IMGUR_CLIENT_ID:-}" ]; then
            echo "IMGUR_CLIENT_ID is not configured."
            exit 1
          fi

          poetry run python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          output_dir = Path("var/web-ui-screenshots")
          manifest = json.loads((output_dir / "manifest.json").read_text(encoding="utf-8"))
          links: dict[str, str] = {}

          for page in manifest["pages"]:
              filename = page["filename"]
              screenshot_path = output_dir / filename
              print(f"Uploading {filename} to Imgur...")
              response = subprocess.run(
                  [
                      "curl",
                      "--fail",
                      "--silent",
                      "--show-error",
                      "--request",
                      "POST",
                      "--header",
                      f"Authorization: Client-ID {os.environ['IMGUR_CLIENT_ID']}",
                      "--form",
                      f"image=@{screenshot_path}",
                      "https://api.imgur.com/3/image",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if response.returncode != 0:
                  print(response.stderr, file=sys.stderr)
                  raise SystemExit(response.returncode)

              payload = json.loads(response.stdout)
              link = payload.get("data", {}).get("link")
              if not payload.get("success") or not link:
                  print(response.stdout, file=sys.stderr)
                  raise SystemExit(f"Imgur upload did not return a link for {filename}")
              links[filename] = link

          (output_dir / "image-links.json").write_text(
              json.dumps(links, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Comment screenshots on PR
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.resolve_pr.outputs.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(
              fs.readFileSync('var/web-ui-screenshots/manifest.json', 'utf8')
            );
            const imageLinks = JSON.parse(
              fs.readFileSync('var/web-ui-screenshots/image-links.json', 'utf8')
            );
            const marker = '<!-- web-ui-screenshots -->';
            const lines = [
              marker,
              '## Web UI Screenshots',
              '',
              `Generated ${manifest.pages.length} screenshots for this PR.`,
              `[Workflow run](${process.env.RUN_URL})`,
              '',
            ];

            for (const page of manifest.pages) {
              const imageUrl = imageLinks[page.filename];
              if (!imageUrl) {
                throw new Error(`Missing uploaded image URL for ${page.filename}`);
              }
              lines.push(
                `### ${page.title}`,
                '',
                `Route: \`${page.path}\``,
                '',
                `[![${page.title}](${imageUrl})](${imageUrl})`,
                ''
              );
            }

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

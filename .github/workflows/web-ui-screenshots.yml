name: Web UI Screenshots

on:
  pull_request:

concurrency:
  group: web-ui-screenshots-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  web-ui-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TEMPERATURE_BOT_CONFIG: "etc/temperature-bot-config-local-dev.yaml"
      AE200_SIMULATOR: 1
      HUBITAT_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_SIMULATOR: 1
      TEMPERATURE_BOT_CONTROL_MODE: simulator
      UV_VERSION: '0.11.26'
      RUFF_VERSION: '0.15.15'
    steps:
      - name: Resolve pull request
        id: resolve_pr
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoFullName = `${owner}/${repo}`;
            let pull = context.payload.pull_request;

            if (!pull) {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
                per_page: 1,
              });
              pull = pulls[0];
            }

            core.setOutput('number', pull ? String(pull.number) : '');
            core.setOutput(
              'same_repo',
              pull ? String(pull.head.repo.full_name === repoFullName) : 'false'
            );

      - name: Checkout
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify project metadata
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: make project-metadata-check

      - name: Set up Node.js
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache Playwright browsers
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/cache@v6
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Ubuntu
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: |
          make install-ubuntu

      - name: Render web UI screenshots
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        run: |
          make web-screenshots

      - name: Upload screenshots artifact
        id: upload_screenshots
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-screenshots-pr-${{ steps.resolve_pr.outputs.number }}-${{ github.sha }}
          path: var/web-ui-screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Comment screenshots on PR
        if: steps.resolve_pr.outputs.number != '' && steps.resolve_pr.outputs.same_repo == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.resolve_pr.outputs.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload_screenshots.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(
              fs.readFileSync('var/web-ui-screenshots/manifest.json', 'utf8')
            );
            const marker = '<!-- web-ui-screenshots -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);

            const lines = [
              marker,
              '## Web UI Screenshots',
              '',
              `[Download screenshots artifact](${process.env.ARTIFACT_URL})`,
              '',
              `Generated by [this workflow run](${process.env.RUN_URL}); retained for 30 days.`,
              '',
              '<details>',
              `<summary>List ${manifest.pages.length} generated screenshots</summary>`,
              '',
            ];

            for (const page of manifest.pages) {
              lines.push(
                `### ${page.title}`,
                '',
                `Route: \`${page.path}\``,
                '',
                `Artifact file: \`${page.filename}\``,
                ''
              );
            }
            lines.push('</details>', '');

            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

name: Web UI Screenshots

on:
  pull_request:

jobs:
  web-ui-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TEMPERATURE_BOT_CONFIG: "tests/temperature-bot-config-test.yaml"
      AE200_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_SIMULATOR: 1
      POETRY_VERSION: '2.1.3'
      RUFF_VERSION: '0.15.15'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: screenshots-venv-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            screenshots-venv-${{ runner.os }}-3.12-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Ubuntu
        run: |
          make install-ubuntu

      - name: Render web UI screenshots
        run: |
          make web-screenshots

      - name: Upload web UI screenshots artifact
        id: upload_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-screenshots-${{ github.run_id }}
          path: var/web-ui-screenshots
          if-no-files-found: error

      - name: Comment screenshots on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: web-ui-screenshots-${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload_screenshots.outputs.artifact-url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(
              fs.readFileSync('var/web-ui-screenshots/manifest.json', 'utf8')
            );
            const marker = '<!-- web-ui-screenshots -->';
            const artifactUrl = process.env.ARTIFACT_URL || process.env.RUN_URL;
            const lines = [
              marker,
              '## Web UI Screenshots',
              '',
              `Generated ${manifest.pages.length} screenshots for this PR.`,
              '',
              `Download: [${process.env.ARTIFACT_NAME}](${artifactUrl})`,
              '',
              'Contents:',
            ];

            for (const page of manifest.pages) {
              lines.push(
                `- ${page.title}: \`${page.path}\` (${page.filename})`
              );
            }

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

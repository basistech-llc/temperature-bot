# See https://docs.github.com/en/actions/guides/building-and-testing-python
# Temperature Bot uses SQLite plus Flyway migrations. The Makefile owns all
# setup, check, and test entrypoints used by CI and local development.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: ['macos-latest', 'ubuntu-latest']
        python-version: [3.12]
    runs-on: ${{ matrix.os }}
    env:
      TEMPERATURE_BOT_CONFIG: "tests/temperature-bot-config-test.yaml"
      AE200_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      POETRY_VERSION: '2.1.3'
      RUFF_VERSION: '0.15.15'
      FLYWAY_VERSION: '12.8.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the project venv (created by Poetry in-project)
      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      # (Optional) cache ruff’s cache
      - name: Cache ruff cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('.ruff*', 'pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      # Use a repo-local Playwright cache to make cross-OS paths easy
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure ubuntu"
        if: runner.os == 'Linux'
        run: |
          make install-ubuntu

      - name: "Configure macOS"
        if: runner.os == 'macOS'
        run: |
          make install-macos

      - name: Install Flyway
        run: |
          case "${RUNNER_OS}-$(uname -m)" in
            Linux-x86_64)
              FLYWAY_PLATFORM="linux-x64"
              ;;
            macOS-arm64)
              FLYWAY_PLATFORM="macosx-arm64"
              ;;
            macOS-x86_64)
              FLYWAY_PLATFORM="macosx-x64"
              ;;
            *)
              echo "Unsupported Flyway platform: ${RUNNER_OS}-$(uname -m)"
              exit 1
              ;;
          esac
          FLYWAY_TAR="flyway-commandline-${FLYWAY_VERSION}-${FLYWAY_PLATFORM}.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${FLYWAY_TAR}" \
            "https://github.com/flyway/flyway/releases/download/flyway-${FLYWAY_VERSION}/${FLYWAY_TAR}"
          mkdir -p /tmp/flyway-install
          tar -xzf "/tmp/${FLYWAY_TAR}" -C /tmp/flyway-install
          FLYWAY_DIR="/tmp/flyway-install/flyway-${FLYWAY_VERSION}"
          echo "${FLYWAY_DIR}" >> "$GITHUB_PATH"
          export PATH="${FLYWAY_DIR}:${PATH}"
          flyway -v

      - name: Check
        run: |
          make check

      - name: Test with coverage
        run: |
          make test

      - name: Upload coverage test to codecov.io
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

# See https://docs.github.com/en/actions/guides/building-and-testing-python
# 2025-06-15 - slg - Complete rewrite to avoid MySQL and use DynamoDB and S3 local variants.
#                    These are automatically configured with install-ubuntu or install-macos
name: CI (pip)
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: ['macos-latest', 'ubuntu-latest']
        python-version: [3.12]
    runs-on: ${{ matrix.os }}
    env:
      TEMPERATURE_BOT_CONFIG: "tests/temperature-bot-config-test.yaml"
      AE200_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      POETRY_VERSION: '2.1.3'
      RUFF_VERSION: '0.13.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the project venv (created by Poetry in-project)
      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      # (Optional) cache ruff’s cache
      - name: Cache ruff cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('.ruff*', 'pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      # Use a repo-local Playwright cache to make cross-OS paths easy
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure ubuntu"
        if: runner.os == 'Linux'
        run: |
          make install-ubuntu

      - name: "Configure macOS"
        if: runner.os == 'macOS'
        run: |
          make install-macos

      - name: Install Flyway (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/flyway-commandline-linux-x64.tar.gz \
            https://github.com/flyway/flyway/releases/latest/download/flyway-commandline-linux-x64.tar.gz
          mkdir -p /tmp/flyway-install
          tar -xzf /tmp/flyway-commandline-linux-x64.tar.gz -C /tmp/flyway-install
          echo "/tmp/flyway-install/$(ls /tmp/flyway-install)" >> $GITHUB_PATH
          flyway -v

      - name: Install Flyway (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install flyway
          flyway -v

      - name: Lint
        run: |
          make pylint

      - name: Test with coverage
        run: |
          make test

      - name: Upload coverage test to codecov.io
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

# See https://docs.github.com/en/actions/guides/building-and-testing-python
# Temperature Bot uses SQLite plus Flyway migrations. The Makefile owns all
# setup, check, and test entrypoints used by CI and local development.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: ['macos-latest', 'ubuntu-latest']
        python-version: [3.12]
    runs-on: ${{ matrix.os }}
    env:
      TEMPERATURE_BOT_CONFIG: "tests/temperature-bot-config-test.yaml"
      AE200_SIMULATOR: 1
      HUBITAT_SIMULATOR: 1
      AIRTHINGS_SIMULATOR: 1
      AQICN_SIMULATOR: 1
      TEMPERATURE_BOT_CONTROL_MODE: simulator
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      UV_VERSION: '0.11.26'
      RUFF_VERSION: '0.15.15'
      FLYWAY_VERSION: '12.8.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The source-deployment integration test clones this checkout.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # (Optional) cache ruff’s cache
      - name: Cache ruff cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ruff
          key: ruff-${{ runner.os }}-${{ hashFiles('.ruff*', 'pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      # Use a repo-local Playwright cache to make cross-OS paths easy
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: .playwright
          key: pw-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Update GITHUB_PATH and install Python dependencies for local development
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure ubuntu"
        if: runner.os == 'Linux'
        run: |
          make install-ubuntu

      - name: "Configure macOS"
        if: runner.os == 'macOS'
        run: |
          make install-macos

      - name: Install Flyway
        run: |
          case "${RUNNER_OS}-$(uname -m)" in
            Linux-x86_64)
              FLYWAY_PLATFORM="linux-x64"
              ;;
            macOS-arm64)
              FLYWAY_PLATFORM="macosx-arm64"
              ;;
            macOS-x86_64)
              FLYWAY_PLATFORM="macosx-x64"
              ;;
            *)
              echo "Unsupported Flyway platform: ${RUNNER_OS}-$(uname -m)"
              exit 1
              ;;
          esac
          FLYWAY_TAR="flyway-commandline-${FLYWAY_VERSION}-${FLYWAY_PLATFORM}.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${FLYWAY_TAR}" \
            "https://github.com/flyway/flyway/releases/download/flyway-${FLYWAY_VERSION}/${FLYWAY_TAR}"
          mkdir -p /tmp/flyway-install
          tar -xzf "/tmp/${FLYWAY_TAR}" -C /tmp/flyway-install
          FLYWAY_DIR="/tmp/flyway-install/flyway-${FLYWAY_VERSION}"
          echo "${FLYWAY_DIR}" >> "$GITHUB_PATH"
          export PATH="${FLYWAY_DIR}:${PATH}"
          flyway -v

      - name: Check
        run: |
          make check

      - name: Build and verify wheel
        run: |
          make build-check

      - name: Test with coverage
        run: |
          make test

      - name: Upload coverage test to codecov.io
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  deployment-package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_VERSION: '0.11.26'
      FLYWAY_VERSION: '12.8.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build and install deployment package in a disposable root
        run: make deployment-package-check

      - name: Verify systemd units
        run: make systemd-verify

      - name: Upload ephemeral deployment package
        uses: actions/upload-artifact@v7
        with:
          name: temperature-bot-deployment-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            dist/temperature-bot-deployment-*.zip
            dist/temperature-bot-deployment-*.zip.sha256
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
